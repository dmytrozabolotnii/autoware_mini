local_path_length: 100          # m
braking_reaction_time: 1.6      # s
stopping_lateral_distance: 1.35 # m
waypoint_interval: 1.0          # m
default_acceleration: 1.0       # m/s2
default_deceleration: 1.0       # m/s2
max_deceleration: 10.0          # m/s2
stopped_speed_limit: 1.0        # m/s
lane_change_base_length: 10.0   # m
lane_change_perlane_length: 5.0 # m
speed_limit: 50.0               # max velocity for route (km/h), will be replaced by speed taken from map
output_frame: map
distance_to_goal_limit: 5.0     # m
ego_vehicle_stopped_speed_limit: 0.1
use_object_width: True          # use object width for predictions and collision checks in trajectory_collision_checker and pedestrian_crosswalk_checker
default_left_width: 1.4         # m
default_right_width: 1.4        # m

lanelet2_global_planner:
  distance_to_centerline_limit: 5.0
  lane_change: False
  lanelet_search_radius: 0.5

lanelet2_map_visualizer:
  use_map_extraction: False     # extract smaller map area around the ego vehicle for visualization
  map_extraction_distance: 500  # m - distance from ego vehicle to extract map data

waypoint_loader:
  output_frame: map

waypoint_saver:
  interval: 1.0

path_smoothing:
  adjust_speeds_in_curves: True
  adjust_speeds_using_deceleration: True
  speed_averaging_window: 21              # window size (will be applied only if > 1)
  adjust_endpoint_speed_to_zero: True
  radius_calc_neighbour_index: 8          # int
  lateral_acceleration_limit: 1.5         # m/s2
  output_debug_info: False

local_path_extractor:
  publish_rate: 10                        # Hz 
goal_stop_checker:
  braking_safety_distance_goal: 0.1       # m
traffic_light_stopline_checker:
  braking_safety_distance_stopline: 2     # m
  tfl_force_stop_speed_limit: 5.0         # km/h
  tfl_maximum_deceleration: 2.8           # m/s2
object_collision_checker:
  braking_safety_distance_obstacle: 4     # m
pedestrian_crosswalk_checker:
  braking_safety_distance_crosswalk: 6    # m
  crossing_angle_max_limit: 70            # degrees
trajectory_collision_checker:
  braking_safety_distance_yield: 0.1      # m
  braking_safety_distance_obstacle: 4     # m
  yielding_distance_limit: 40.0           # m
  heading_alignment_limit: 20.0           # degrees
automatic_stop_behavior:
  braking_safety_distance_stop_line: 0.1      # m
  keep_stop_line_for: 15.0                    # s
collision_points_merger:
  synchronization_queue_size: 4
  synchronization_slop: 0.15
speed_planner:
  synchronization_queue_size: 4
  synchronization_slop: 0.15
openpilot_local_planner:
  transform_timeout: 0.06
