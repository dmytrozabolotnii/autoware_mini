coordinate_transformer: utm         # utm, lest97
use_custom_origin: True
utm_origin_lat: 0.0
utm_origin_lon: 0.0
lest97_origin_northing: 6465000.0
lest97_origin_easting: 650000.0

novatel_oem7_localizer:
  use_msl_height: True
  default_azimuth: 185.0  # degrees
  default_height: 34.5    # meters
  child_frame: base_link

lane_boundary_matcher:
  lookahead_distance: 3.5
  enable_height_correction: False
  x_correction_treshold: 0.5
  y_correction_treshold: 0.5
  yaw_correction_treshold: 0.1
  probability_treshold: 0.4
  transform_timeout: 0.06
  openpilot_delay_compensation: 0.1
  alpha: 0.03
  
