coordinate_transformer: utm         # utm, lest97
use_custom_origin: True
utm_origin_lat: 0.0
utm_origin_lon: 0.0
lest97_origin_northing: 6465000.0
lest97_origin_easting: 650000.0

novatel_oem7_localizer:
  use_msl_height: True

lane_boundary_matcher:
  only_lateral_correction: False
  y_correction_treshold: 0.5
  z_correction_treshold: 0.8
  yaw_correction_treshold: 0.1
  transform_timeout: 0.06
  alpha: 0.03
